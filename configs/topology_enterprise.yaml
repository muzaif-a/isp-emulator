# Enterprise ISP Topology — Phase 3
#
# Network layout:
#
#          ISP backbone (s1)
#    /      /      |      \      \
#  r1      r2     r3     r4   vpnhub
#  |        |      |      |
# office  dc    branch   lab
# h1,h2  web1  h4,h5  lab1,lab2,lab3
#        db1
#        ftp1
#        dns1
#
# WireGuard VPN: vpnhub is the hub; r1–r4 are spokes.

# ── Device classes (seed_generator tc profile) ─────────────────────────────
vpn:
  enabled: false
  mode: hybrid           # site_to_site | remote_access | hybrid
  nat: true              # MASQUERADE VPN client traffic — hides client IPs at gateway
  server:
    node: vpnhub
  peers:                 # gateway-level peers (router VPN — whole LAN tunnels)
    - r1
    - r2
    - r3
    - r4
  clients:               # direct host VPN clients (personal VPN — bypass router)
    - h2
    - h4

exfiltration:
  attacker: h2
  target:
    host: db1
    port: 9090
  endpoints:
    - /api/employees
    - /api/products
  attack_tos: 0x10

# ── ISP infrastructure ─────────────────────────────────────────────────────
nodes:
  - name: s1
    type: switch

  - name: vpnhub
    type: host

links:
  - nodes: [s1, vpnhub]
    tc: {bw: 1000, delay: 5ms, jitter: 2ms, loss: 0, max_queue_size: 2000}

# ── LANs (auto-creates routers, LAN switches, hosts, and links) ────────────
lans:

  - name: office
    gateway: r1
    isp_switch: s1
    hosts:
      - h1
      - h2

  - name: datacenter
    gateway: r2
    isp_switch: s1
    hosts:
      - web1
      - db1
      - ftp1
      - dns1          # DNS server for the enterprise

  - name: branch
    gateway: r3
    isp_switch: s1
    hosts:
      - h4
      - h5

  - name: lab           # New LAN — added in Phase 3
    gateway: r4
    isp_switch: s1
    hosts:
      - lab1
      - lab2
      - lab3

# ── NPC background traffic hosts ──────────────────────────────────────────
npc:
  hosts:
    h2:   high
    h4:   medium
    h5:   medium
    lab1: low
    lab2: low
    lab3: low

# ── WireGuard VPN ──────────────────────────────────────────────────────────
vpn_gateways:
  - vpnhub

vpn_peers:
  - gateway: vpnhub
    clients:
      - r1
      - r2
      - r3
      - r4            # Lab LAN gateway added as VPN client
      - h2            # direct attacker VPN client (personal VPN)
      - h4            # direct attacker VPN client (personal VPN)

# ── Services (auto-deployed in 'auto' mode) ────────────────────────────────
# Uses 'node:' key (new form) — 'host:' also accepted for backward compat.
services:

  - node: web1
    type: http
    port: 8080

  - node: ftp1
    type: ftp
    port: 21

  - node: web1
    type: smtp
    port: 25

  - node: dns1
    type: dns
    port: 53
    options:
      reply_ip: "10.0.0.1"   # DNS always resolves to ISP (demo)

  - node: r1
    type: ssh
    port: 22

  - node: h1
    type: echo
    port: 7
    options:
      proto: tcp

# ── SQLite database with auto-generated data and CRUD REST API ───────────
databases:
  - host: db1
    name: company
    engine: sqlite
    api_port: 9090 
    timing_protocol:
      enabled: true
      secret_key: enterprise-company-covert-key
      type: auto            # net-flow | app-flow | auto (default)
      short_delay_ms: 20    # bit=0 IPD (ms) — change for Tor/ISP modes
      long_delay_ms: 50     # bit=1 IPD (ms) — must satisfy: long - short >> max_jitter
    tables:
      - name: employees
        rows: 50
        schema:
          id: integer
          first_name: first_name
          last_name: last_name
          email: email
          department: department
          salary: salary

      - name: products
        rows: 25
        schema:
          id: integer
          product_name: product
          category: category
          price: price

# ── Deployment mode ─────────────────────────────────────────────────────────
deployment:
  mode: auto    # auto | manual | hybrid


# ── Optional manual route overrides (applied after auto-routing) ─────────────
# Remove the '#' below to activate. Auto-routing handles everything by default.
#routes:
#  - node: r1
#    destination: 192.168.99.0/24
#    via: 10.0.0.99
#  - node: r2
#    destination: 0.0.0.0/0
#    via: 10.0.0.1

# ── Packet capture configuration ─────────────────────────────────────────────
capture:
  automatic: true

  devices:
    - r1
    - r2
    - r3
    - r4
    - h1
    - h2
    - h4
    - h5
    - lab1
    - lab2
    - lab3
    - db1
    - web1
    - ftp1
    - dns1
    - vpnhub
    - s1

  cleanup:
    enabled: true

settings:
  isp_base_network: "10.0.0.0/8"
  lan_base_network: "192.168.0.0/16"
  vpn_base_network: "172.16.0.0/12"
  vpn_port: 51820
  log_level: "INFO"
