# topology_wan_isp.yaml
#
# WAN-scale ISP-realistic bandwidth experiment.
#
# Research purpose:
#   Tests watermark survival under ISP-realistic bandwidth constraints.
#   The existing topologies use virtual Mininet links at 22,000–44,000 Mbps,
#   where NPC queuing delay is negligible (< 0.006ms). At real ISP speeds
#   (10–100 Mbps for isp_access, 100–1,000 Mbps for isp_enterprise), queuing
#   delay at the TBF becomes 1–11ms — enough to introduce significant jitter.
#
#   This topology uses isp_access and wan TC area types to bring the emulator
#   into a regime that matches real ISP infrastructure. Run `apply tc --seed N`
#   to activate the TC profile before generating dataset sessions.
#
# Key differences from existing topologies:
#   - TC area types: wan/isp_enterprise for backbone, isp_access for LANs.
#   - device_classes: wan_router for gateways (higher processing latency model).
#   - Minimal services — focus is on TC accuracy, not service variety.
#   - Two sites only — keeps the topology simple for TC calibration experiments.
#
# Network layout:
#
#          s1 (ISP backbone — isp_enterprise area)
#         /      |       \
#      vpnhub   r1        r2
#   (isp_ent)  (wan)     (wan)
#                |         |
#           Site A LAN  Site B LAN
#          (isp_access) (isp_access)
#           db1, web1   h1, h2
#           (victim)   (attacker)
#

# ── Device classes ─────────────────────────────────────────────────────────────
# wan_router gives higher processing latency bounds than lan_router,
# matching real ISP CPE (customer-premises equipment) behavior.
exfiltration:
  attacker: h1
  target:
    host: db1
    port: 9090
  endpoints:
    - /api/employees
    - /api/products
  attack_tos: 0x10

# ── ISP backbone and VPN hub ───────────────────────────────────────────────────
nodes:
  - name: s1
    type: switch

  - name: vpnhub
    type: host

links:
  - nodes: [s1, vpnhub]
    tc: {bw: 1000, delay: 5ms, jitter: 2ms, loss: 0, max_queue_size: 2000}

# ── LANs ──────────────────────────────────────────────────────────────────────
lans:

  - name: sitea           # Victim site — holds the database
    gateway: r1
    isp_switch: s1
    hosts:
      - db1               # victim database (timing protocol enabled)
      - web1              # web server (additional traffic source)

  - name: siteb           # Attacker site
    gateway: r2
    isp_switch: s1
    hosts:
      - h1                # attacker
      - h2                # background user (NPC)

# ── VPN — site_to_site ────────────────────────────────────────────────────────
vpn:
  enabled: false
  mode: hybrid
  nat: true
  server:
    node: vpnhub
  peers:               # router VPN — site-level tunnels
    - r1
    - r2
  clients:             # direct host VPN — attacker bypasses site router
    - h1

vpn_gateways:
  - vpnhub

vpn_peers:
  - gateway: vpnhub
    clients:
      - r1
      - r2
      - h1            # direct attacker VPN client

# ── NPC background traffic ─────────────────────────────────────────────────────
# Medium intensity at the attacker site simulates typical user activity while
# the exfiltration happens. This is the most interesting condition for WAN
# jitter testing — enough load to cause queuing at ISP speeds, but not so
# much that the watermark is completely overwhelmed.
npc:
  hosts:
    h2: medium

# ── Services ──────────────────────────────────────────────────────────────────
services:
  - node: web1
    type: http
    port: 8080

# ── Victim database with timing protocol ──────────────────────────────────────
databases:
  - host: db1
    name: sitedata
    engine: sqlite
    api_port: 9090
    timing_protocol:
      enabled: true
      secret_key: wan_isp_key
      type: auto          # net-flow | app-flow | auto (default)
      short_delay_ms: 20  # bit=0 IPD (ms)
      long_delay_ms: 50   # bit=1 IPD (ms)
    tables:
      - name: records
        rows: 500
        schema:
          id: integer
          first_name: first_name
          last_name: last_name
          email: email
          department: department
          salary: salary

      - name: transactions
        rows: 200
        schema:
          id: integer
          amount: price
          category: category
          date: date

# ── Deployment ────────────────────────────────────────────────────────────────
deployment:
  mode: auto


# ── Packet capture ────────────────────────────────────────────────────────────
capture:
  automatic: true

  devices:
    - h1          # attacker
    - h2          # background user
    - r2          # Site B CPE (WAN-facing)
    - vpnhub      # VPN hub (encryption boundary)
    - r1          # Site A CPE (WAN-facing)
    - db1         # victim database
    - web1

  cleanup:
    enabled: true

settings:
  isp_base_network: "10.0.0.0/8"
  lan_base_network: "192.168.0.0/16"
  vpn_base_network: "172.16.0.0/12"
  vpn_port: 51820
  log_level: "INFO"

# ── Traffic control — ISP-realistic TC profiles ───────────────────────────────
# Interface names are derived from the node names and link order above.
# Run: apply tc --seed 42
#
# Backbone (s1) interfaces:
#   s1-eth0 → vpnhub  (first link declared: [s1, vpnhub])
#   s1-eth1 → r1      (from lans expansion, sitea)
#   s1-eth2 → r2      (from lans expansion, siteb)
#
# LAN switches created by lans expansion:
#   lan_sw_sitea → alias lss1   (word initials: l+s+s = "lss", first occurrence)
#   lan_sw_siteb → alias lss2   (same initials, second occurrence)
#
# Router interfaces:
#   r1-eth0 → s1 (ISP/WAN side),  r1-eth1 → lss1 (LAN side)
#   r2-eth0 → s1 (ISP/WAN side),  r2-eth1 → lss2 (LAN side)