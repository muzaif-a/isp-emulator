# ISP Network emulator - Topology Configuration
#
# Device classes drive TC profile selection in tc_generator.py.

device_classes:
  s1:      isp_backbone_switch
  r1:      lan_router
  r3:      lan_router
  h2:      lan_host
  vpnhub:  vpn_concentrator
  h3:      lan_host
#
# Roles:
#   h2 — attacker  (VPN client, initiates traffic toward h3)
#   h3 — victim    (runs HTTP server + SQLite DB with timing protocol)
#
# Packet flow:
#   H2 (attacker/WG client) ── R1 ── S1 (ISP switch) ── VPN Hub (WG server)
#                                     S1               ── R3 (router) ── H3 (victim)

nodes:
  - name: s1
    type: switch

  - name: r1
    type: router

  - name: r3
    type: router

  - name: h2
    type: host

  - name: vpnhub
    type: host

  - name: h3
    type: host

links:
  - [h2, r1]
  - [r1, s1]
  - [s1, vpnhub]
  - [s1, r3]
  - [r3, h3]

lan_gateways:
  - r1
  - r3

vpn_gateways:
  - vpnhub

vpn_peers:
  - gateway: vpnhub
    clients:
      - h2

vpn:
  enabled: false
  mode: remote_access
  nat: true

attackers:
  - h2

# ── Services (victim h3) ──────────────────────────────────────────────────────
services:
  - node: h3
    type: http
    port: 8080

# ── SQLite database on victim h3 with timing protocol ────────────────────────
databases:
  - host: h3
    name: victimdb
    engine: sqlite
    api_port: 9090
    timing_protocol:
      enabled: true
      secret_key: example_key
    tables:
      - name: users
        rows: 50
        schema:
          id: integer
          username: username
          email: email
          department: department
          salary: salary

      - name: sessions
        rows: 25
        schema:
          id: integer
          user_id: integer
          token: text
          created_at: timestamp

# ── Deployment mode ───────────────────────────────────────────────────────────
deployment:
  mode: auto

settings:
  isp_base_network: "10.0.0.0/8"
  lan_base_network: "192.168.0.0/16"
  vpn_base_network: "172.16.0.0/12"
  vpn_port: 51820
  log_level: "INFO"

# ── TC shaping (TBF+netem) ────────────────────────────────────────────────────
traffic_control:
  s1-eth0:     {area: man}
  s1-eth1:     {area: man}
  s1-eth2:     {area: man}
  r1-eth0:     {area: lan}
  r1-eth1:     {area: man}
  r3-eth0:     {area: man}
  r3-eth1:     {area: lan}
  h2-eth0:     {area: lan}
  vpnhub-eth0: {area: man}
  h3-eth0:     {area: lan}

  links:
    - interfaces: [h2-eth0, r1-eth0]
      medium: copper
    - interfaces: [r1-eth1, s1-eth0]
      medium: fiber
    - interfaces: [s1-eth1, vpnhub-eth0]
      medium: fiber
    - interfaces: [s1-eth2, r3-eth0]
      medium: fiber
    - interfaces: [r3-eth1, h3-eth0]
      medium: copper

# ── Packet Capture Configuration ─────────────────────────────────────────────
capture:
  automatic: true

  devices:
    - h2
    - r1
    - vpnhub
    - r3
    - h3

  cleanup:
    enabled: true

  parser:
    enabled: false
    endpoint:
      - network/parserapi/csv_parser.py
    dir:
      - dataset/csv

  feature_selector:
    - network/featureselection/feature_selector.py

  feature_selection:
    DEVICE:            network/featureselectionapi.py:get_device
    INTERFACE:         network/featureselectionapi.py:get_interface
    FRAME_NO:          network/featureselectionapi.py:get_frame_number
    TIMESTAMP:         network/featureselectionapi.py:get_timestamp
    SOURCE:            network/featureselectionapi.py:get_source
    DESTINATION:       network/featureselectionapi.py:get_destination
    PROTOCOL:          network/featureselectionapi.py:get_protocol
    LENGTH:            network/featureselectionapi.py:get_length
    SOURCE_PORT:       network/featureselectionapi.py:get_source_port
    DESTINATION_PORT:  network/featureselectionapi.py:get_destination_port
    INFO:              network/featureselectionapi.py:get_info
