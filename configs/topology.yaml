# ISP Network emulator - Topology Configuration
#
# Roles:
#   h2 — attacker  (VPN client, initiates traffic toward h3)
#   h3 — victim    (runs HTTP server + SQLite DB with timing protocol)
#
# Packet flow:
#   H2 (attacker/WG client) ── R1 ── S1 (ISP switch) ── VPN Hub (WG server)
#                                     S1               ── R3 (router) ── H3 (victim)

nodes:
  - name: s1
    type: switch

  - name: r1
    type: router

  - name: r3
    type: router

  - name: h2
    type: host

  - name: vpnhub
    type: host

  - name: h3
    type: host

links:
  - nodes: [h2, r1]
    tc: {bw: 100, delay: 2ms, jitter: 1ms, loss: 0, max_queue_size: 1000}
  - nodes: [r1, s1]
    tc: {bw: 1000, delay: 5ms, jitter: 2ms, loss: 0, max_queue_size: 2000}
  - nodes: [s1, vpnhub]
    tc: {bw: 1000, delay: 5ms, jitter: 2ms, loss: 0, max_queue_size: 2000}
  - nodes: [s1, r3]
    tc: {bw: 1000, delay: 5ms, jitter: 2ms, loss: 0, max_queue_size: 2000}
  - nodes: [r3, h3]
    tc: {bw: 100, delay: 2ms, jitter: 1ms, loss: 0, max_queue_size: 1000}

lan_gateways:
  - r1
  - r3

vpn_gateways:
  - vpnhub

vpn_peers:
  - gateway: vpnhub
    clients:
      - h2

vpn:
  enabled: false
  mode: remote_access
  nat: true

exfiltration:
  attacker: h2
  target:
    host: h3
    port: 9090
  endpoints:
    - /api/users
    - /api/sessions
  attack_tos: 0x10

# ── Services (victim h3) ──────────────────────────────────────────────────────
services:
  - node: h3
    type: http
    port: 8080

# ── SQLite database on victim h3 with timing protocol ────────────────────────
databases:
  - host: h3
    name: victimdb
    engine: sqlite
    api_port: 9090
    timing_protocol:
      enabled: true
      secret_key: topology-victimdb-covert-key
    tables:
      - name: users
        rows: 50
        schema:
          id: integer
          username: username
          email: email
          department: department
          salary: salary

      - name: sessions
        rows: 25
        schema:
          id: integer
          user_id: integer
          token: text
          created_at: timestamp

# ── Deployment mode ───────────────────────────────────────────────────────────
deployment:
  mode: auto

settings:
  isp_base_network: "10.0.0.0/8"
  lan_base_network: "192.168.0.0/16"
  vpn_base_network: "172.16.0.0/12"
  vpn_port: 51820
  log_level: "INFO"

# ── Packet Capture Configuration ─────────────────────────────────────────────
capture:
  automatic: true

  devices:
    - h2
    - r1
    - vpnhub
    - r3
    - h3

  cleanup:
    enabled: true
